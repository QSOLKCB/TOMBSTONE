name: Phase 13 — pinned HACL SHA2-256 and receipt parity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: SHA-256 backend and receipt parity (${{ matrix.compiler }} / ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install C99 compilers and original OpenSSL dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc clang pkg-config libssl-dev
      - name: Verify pinned upstream HACL source and license
        run: python3 tools/check_hacl_source.py
      - name: Verify reference proof source identities and accepted trust boundary
        run: python3 tools/check_phase13_evidence.py
      - name: Run original and HACL C99 engines against identical fixtures
        run: |
          set -euo pipefail
          make SHA256_BACKEND=openssl CC=${{ matrix.compiler }} test
          make SHA256_BACKEND=hacl CC=${{ matrix.compiler }} test
      - name: Exercise HACL adapter allocation and update failures
        run: |
          set -euo pipefail
          HACL_INC="-Ivendor/hacl-star/dist/gcc-compatible -Ivendor/hacl-star/dist/karamel/include -Ivendor/hacl-star/dist/karamel/krmllib/dist/minimal"
          ${{ matrix.compiler }} -std=c99 -O2 -D_DEFAULT_SOURCE -Iinclude $HACL_INC \
            tests/formal/test_hacl_adapter_faults.c build/hacl/libtombstone.a \
            -Wl,--wrap=calloc -Wl,--wrap=malloc \
            -Wl,--wrap=Hacl_Hash_SHA2_update_256 \
            -o "$RUNNER_TEMP/tombstone-hacl-faults"
          "$RUNNER_TEMP/tombstone-hacl-faults"
      - name: HACL ASan and UBSan C99 tests
        run: make SHA256_BACKEND=hacl CC=${{ matrix.compiler }} sanitizer-test
      - name: Build independent Rust CLI binaries
        run: |
          set -euo pipefail
          TOMBSTONE_SHA256_BACKEND=hacl CC=${{ matrix.compiler }} CARGO_TARGET_DIR="$RUNNER_TEMP/hacl" cargo build -p tombstone-cli --release --offline --locked
          TOMBSTONE_SHA256_BACKEND=openssl CC=${{ matrix.compiler }} CARGO_TARGET_DIR="$RUNNER_TEMP/openssl" cargo build -p tombstone-cli --release --offline --locked
      - name: Independently check exact receipt fixtures and digest parity
        run: |
          python3 tools/check_portability.py \
            "$RUNNER_TEMP/hacl/release/tombstone" \
            "$RUNNER_TEMP/openssl/release/tombstone"
      - name: Test complete HACL Rust FFI and CLI workspace
        run: TOMBSTONE_SHA256_BACKEND=hacl CC=${{ matrix.compiler }} CARGO_TARGET_DIR="$RUNNER_TEMP/hacl-tests" cargo test --workspace --offline --locked

  adapter_cbmc:
    name: Bounded C99 HACL adapter status / no-write proof (provider modeled)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Confirm exact production adapter/model compiles as Linux C99
        run: |
          gcc -std=c99 -D_DEFAULT_SOURCE -Wno-pedantic -Wall -Wextra -Werror \
            -Iinclude -Ivendor/hacl-star/dist/gcc-compatible \
            -Ivendor/hacl-star/dist/karamel/include \
            -Ivendor/hacl-star/dist/karamel/krmllib/dist/minimal \
            -c formal/cbmc/hacl_adapter_harness.c -o /tmp/hacl-adapter-model.o
      - name: Check all nonvacuous bounded properties and loop unwinding
        run: |
          set -euo pipefail
          for target in check_one_shot check_stream check_invalid; do
            timeout 300 docker run --rm --entrypoint cbmc -v "$PWD:/repo:ro" -w /repo \
              ghcr.io/diffblue/cbmc:6.11.0 \
              --function "$target" --unwind 96 --unwinding-assertions \
              --bounds-check --pointer-check --signed-overflow-check --unsigned-overflow-check \
              -D_DEFAULT_SOURCE -I include \
              -I vendor/hacl-star/dist/gcc-compatible \
              -I vendor/hacl-star/dist/karamel/include \
              -I vendor/hacl-star/dist/karamel/krmllib/dist/minimal \
              formal/cbmc/hacl_adapter_harness.c
          done

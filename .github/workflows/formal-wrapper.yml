name: Phase 10 — unbounded C99 witness prehash status proof

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp-wrapper:
    name: Frama-C/WP actual prehash decision path (public C99 wrapper)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify production C99 tests and proof overlay C99 syntax
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev
          make test
          gcc -std=c99 -I include -Wall -Wextra -Wpedantic -Werror -c formal/framac/witness_wrapper.c -o /tmp/tombstone-formal-wrapper.o
      - name: Check all three SHA-256 failure sites without publishing plaintext
        run: |
          gcc -std=c99 -I include -Wall -Wextra -Wpedantic -Werror -O2 tests/formal/test_wrapper_hash_failures.c -o /tmp/test_wrapper_hash_failures
          /tmp/test_wrapper_hash_failures
      - name: Verify WP evidence gate rejects vacuous and partial reports
        run: python3 tests/formal/test_wp_gate.py
      - name: Prove actual production prehash status helper with Frama-C/WP
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo:ro" -w /tmp \
            framac/frama-c:32.1@sha256:4f0b7a2bd600c4daabfdcdfa393a3c18301e0db18f3b2739f1d9650193462d36 \
            sh -c 'frama-c -version && frama-c -wp -wp-fct witness_header_status -wp-prover alt-ergo -wp-timeout 20 -wp-rte -wp-par 2 -cpp-extra-args="-I/repo/include" /repo/formal/framac/witness_wrapper.c' \
            2>&1 | tee phase10-wp.log
          python3 tools/check_wp_proofs.py phase10-wp.log
      - name: Upload exact proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tombstone-phase10-prehash-wp-log
          path: phase10-wp.log
          if-no-files-found: warn
          retention-days: 30

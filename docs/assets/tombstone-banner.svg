<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">TOMBSTONE — cryptographic deletion evidence</title>
<desc id="desc">An engraved geometric headstone, fading byte fragments, and a linked checksum chain on a dark charcoal background.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1420"/><stop offset="1" stop-color="#111e2a"/></linearGradient>
  <linearGradient id="stone" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#738897"/><stop offset="0.52" stop-color="#425668"/><stop offset="1" stop-color="#283a4a"/></linearGradient>
  <linearGradient id="link" x1="0" x2="1"><stop stop-color="#35d1c5"/><stop offset="1" stop-color="#d9aa66"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#355366" stroke-width="0.65" opacity="0.32"/></pattern>
</defs>
<rect width="1200" height="330" rx="20" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="328" rx="19" fill="none" stroke="#395364" stroke-width="2"/>
<path d="M20 28H1180V300H20Z" fill="url(#grid)" opacity="0.38"/>
<path d="M93 266V135C93 74 135 43 188 43S283 74 283 135V266Z" fill="#0a1018" stroke="#253646" stroke-width="17"/>
<path d="M101 260V134C101 83 137 52 188 52S275 83 275 134V260Z" fill="url(#stone)" stroke="#9aafbc" stroke-width="2"/>
<path d="M117 136C117 92 149 70 188 70S259 92 259 136" fill="none" stroke="#bed1d7" stroke-width="2" opacity="0.45"/>
<g fill="none" stroke="#d0dfdf" stroke-linecap="round" stroke-width="3" opacity="0.85">
<circle cx="188" cy="125" r="22" stroke="#e4b97b"/>
<path d="M181 116l-7 9 7 8M195 116l7 9-7 8M190 113l-5 24" stroke-width="2.5"/>
</g>
<path d="M131 171H244" stroke="#b8cbd0" stroke-opacity="0.5"/>
<text x="188" y="192" text-anchor="middle" fill="#f3f5ef" font-family="monospace" font-size="14" font-weight="700" letter-spacing="3">SHA-256</text>
<text x="188" y="215" text-anchor="middle" fill="#d1ddd9" font-family="monospace" font-size="12" letter-spacing="2">DELETION</text>
<text x="188" y="233" text-anchor="middle" fill="#86e4d7" font-family="monospace" font-size="11" letter-spacing="1">RECEIPT</text>
<rect x="75" y="257" width="226" height="18" rx="4" fill="#364b5a" stroke="#8da4af"/>
<path d="M57 280H320" stroke="#5d7785" stroke-width="3" stroke-linecap="round"/>
<g fill="#67e0d4" font-family="monospace" font-size="13" opacity="0.72">
<text x="328" y="108">011001</text><text x="335" y="144" opacity="0.75">1010</text>
<text x="330" y="194" opacity="0.60">00</text>
</g>
<g fill="#55cfc7"><rect x="412" y="112" width="8" height="8" rx="1" opacity="0.72"/><rect x="433" y="124" width="6" height="6" rx="1" opacity="0.42"/><rect x="454" y="98" width="4" height="4" rx="1" opacity="0.2"/><rect x="392" y="170" width="6" height="6" opacity="0.42"/><rect x="431" y="187" width="5" height="5" opacity="0.25"/><rect x="466" y="158" width="3" height="3" opacity="0.18"/></g>
<text x="504" y="133" font-family="DejaVu Sans, Arial, sans-serif" font-size="65" font-weight="800" letter-spacing="5" fill="#f0f5f2">TOMBSTONE</text>
<rect x="507" y="158" width="594" height="2" rx="1" fill="url(#link)" opacity="0.8"/>
<text x="507" y="191" font-family="monospace" font-size="19" letter-spacing="2" fill="#8fe2d4">DELETION HAS A FINGERPRINT.</text>
<text x="507" y="225" font-family="monospace" font-size="13" letter-spacing="1.0" fill="#afc3c9">C99 CORE  /  RUST CLI + TUI  /  OPTIONAL GTK</text>
<g stroke="url(#link)" stroke-width="2" fill="none"><path d="M510 275H1082"/></g>
<g fill="#0c1b26" stroke="#60d7cc" stroke-width="2"><rect x="510" y="265" width="20" height="20" rx="3"/><rect x="789" y="265" width="20" height="20" rx="3"/><rect x="1063" y="265" width="20" height="20" rx="3" stroke="#e1b074"/></g>
<g font-family="monospace" font-size="12" fill="#b9cdd0" letter-spacing="1"><text x="545" y="279">BEFORE HASH</text><text x="826" y="279">DELETION HASH</text><text x="1095" y="279">CHAIN</text></g>

[package]
name = "tombstone-gtk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Optional GTK4 desktop frontend for TOMBSTONE C99 evidence engine"
build = "build.rs"

[[bin]]
name = "tombstone-gtk"
path = "src/main.rs"

[dependencies]
tombstone-tui = { path = "../tui" }
tombstone-ffi = { path = "../../bindings/rust" }

# GTK4 is deliberately outside the root Cargo workspace. Headless apps never
# need GTK development headers, a display server or GUI dependencies.
[workspace]
resolver = "2"
